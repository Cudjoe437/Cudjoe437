# One-click deploy: https://render.com/deploy?repo=https://github.com/Cudjoe437/Cudjoe437
services:
  - type: web
    name: rankwise
    runtime: docker
    # Paths are given from the repo root so they don't depend on rootDir semantics.
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    buildFilter:
      paths:
        - app/**
        - render.yaml
    plan: starter            # a persistent disk requires a paid instance
    healthCheckPath: /healthz
    disk:
      name: rankwise-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      # PUBLIC_URL is optional on Render: the app falls back to RENDER_EXTERNAL_URL.
      # Set it only when you add a custom domain.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
